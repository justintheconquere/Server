# Dify — LLM app platform: chatbots, agents, and RAG knowledge bases
# published as web apps/APIs. The future customer-facing slot (e.g. an
# assistant answering from the licensing manuals) — PILOT ONLY for
# now; insurance answers to customers carry compliance weight, and
# nothing built here goes public without Justin's review.
#
# Shape mirrors the official compose for Dify 1.19.0 (images read from
# upstream's own docker-compose.yaml at that tag, 2026-11-09), core
# services only. VERIFY at deploy: diff against upstream's compose —
# 1.19 also ships newer agent-backend services that may be expected,
# and the env surface is large; upstream's .env.example is the
# reference. The ssrf_proxy is omitted for the pilot (Dify fetches
# URLs directly) — add it before any public exposure.
#
# First run: open http://ufo:3017 and create the admin account.
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: dify-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "3017:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy.conf:/etc/nginx/proxy.conf:ro
    labels:
      - homepage.group=AI
      - homepage.name=Dify
      - homepage.icon=dify.svg
      - homepage.href=http://ufo:3017
      - homepage.description=LLM app platform (pilot)

  api:
    image: langgenius/dify-api:1.19.0
    container_name: dify-api
    restart: unless-stopped
    environment: &dify-env
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      CONSOLE_API_URL: ""
      CONSOLE_WEB_URL: ""
      SERVICE_API_URL: ""
      APP_API_URL: ""
      APP_WEB_URL: ""
      FILES_URL: http://ufo:3017
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/1
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: local
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:?set WEAVIATE_API_KEY in .env}
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY:?set SANDBOX_API_KEY in .env}
      PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY:?set PLUGIN_DAEMON_KEY in .env}
      INNER_API_KEY_FOR_PLUGIN: ${INNER_API_KEY_FOR_PLUGIN:?set INNER_API_KEY_FOR_PLUGIN in .env}
    volumes:
      - ./data/api-storage:/app/api/storage
    depends_on:
      - db
      - redis
      - sandbox
      - plugin_daemon
      - weaviate

  worker:
    image: langgenius/dify-api:1.19.0
    container_name: dify-worker
    restart: unless-stopped
    environment:
      <<: *dify-env
      MODE: worker
    volumes:
      - ./data/api-storage:/app/api/storage
    depends_on:
      - db
      - redis
      - sandbox
      - plugin_daemon
      - weaviate

  worker_beat:
    image: langgenius/dify-api:1.19.0
    container_name: dify-beat
    restart: unless-stopped
    environment:
      <<: *dify-env
      MODE: beat
    depends_on:
      - db
      - redis

  web:
    image: langgenius/dify-web:1.19.0
    container_name: dify-web
    restart: unless-stopped
    environment:
      CONSOLE_API_URL: ""
      APP_API_URL: ""

  db:
    image: postgres:15-alpine
    container_name: dify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: dify
    volumes:
      - ./data/db:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    container_name: dify-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - ./data/redis:/data

  sandbox:
    image: langgenius/dify-sandbox:0.2.15
    container_name: dify-sandbox
    restart: unless-stopped
    environment:
      API_KEY: ${SANDBOX_API_KEY:?set SANDBOX_API_KEY in .env}
      GIN_MODE: release

  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.14-local
    container_name: dify-plugin-daemon
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_DATABASE: dify_plugin
      SERVER_PORT: "5002"
      SERVER_KEY: ${PLUGIN_DAEMON_KEY:?set PLUGIN_DAEMON_KEY in .env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - ./data/plugin:/app/storage
    depends_on:
      - db
      - redis

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.13
    container_name: dify-weaviate
    restart: unless-stopped
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:?set WEAVIATE_API_KEY in .env}
      AUTHENTICATION_APIKEY_USERS: dify
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    volumes:
      - ./data/weaviate:/var/lib/weaviate
