# Dify's nginx: one public port, API paths to the api service,
# everything else to the web service. Mirrors upstream's routing.
user nginx;
worker_processes auto;
events { worker_connections 1024; }
http {
  access_log /dev/stdout;
  error_log /dev/stderr;
  sendfile on;
  client_max_body_size 100m;

  server {
    listen 80;
    server_name _;

    location /console/api {
      proxy_pass http://api:5001;
      include /etc/nginx/proxy.conf;
    }
    location /api {
      proxy_pass http://api:5001;
      include /etc/nginx/proxy.conf;
    }
    location /v1 {
      proxy_pass http://api:5001;
      include /etc/nginx/proxy.conf;
    }
    location /files {
      proxy_pass http://api:5001;
      include /etc/nginx/proxy.conf;
    }
    location / {
      proxy_pass http://web:3000;
      include /etc/nginx/proxy.conf;
    }
  }
}
