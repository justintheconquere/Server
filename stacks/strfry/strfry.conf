# strfry relay config — Voodoo Bazaar
db = "/data/strfry-db/"

dbParams {
    maxreaders = 256
    lockfile = "AUTO"
}

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 1000000
    realIpHeader = "x-forwarded-for"

    info {
        name = "Voodoo Bazaar"
        description = "Nostr relay for Voodoo Bazaar seller identity, NIP-05 and Shopstr"
        pubkey = ""
        contact = ""
    }

    ## WRITE POLICY — ENABLE BEFORE PUBLIC EXPOSURE.
    ## An open relay fills with spam within days. strfry write-policy
    ## plugins are executables that read one JSON event per line on stdin
    ## and answer accept/reject. Point this at an allowlist plugin that
    ## only accepts Justin's npub + approved seller npubs, e.g. a small
    ## script kept at /data/policy/allowlist.sh, then uncomment:
    # writePolicy {
    #     plugin = "/data/policy/allowlist.sh"
    # }
}
