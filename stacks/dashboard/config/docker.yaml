# Homepage's Docker connection: the host socket (mounted read-only).
# It exists ONLY so services.yaml tiles can show live container status
# via their "server: ufo" + "container:" keys. Stacks deliberately carry
# NO homepage.* labels: with a server defined here, Homepage would also
# auto-discover labeled containers and every deployed app would appear
# twice (verified live 2026-11-10). services.yaml is the single source
# of truth for tiles.
ufo:
  socket: /var/run/docker.sock
