---
# Homepage tiles. One entry per app: name, icon, link, blurb, and the
# Docker container to watch for status (server: ufo refers to docker.yaml).
# Icons: a bare slug loads from the dashboard-icons set; a "name.svg"
# loads the generated icon from ../icons. Edit + restart the dashboard
# stack to apply.

- Management:
    - Arcane:
        icon: arcane
        href: http://ufo:3552
        description: Docker management
        server: ufo
        container: arcane
    - Backrest:
        icon: backrest
        href: http://ufo:9898
        description: Backups (restic → USB)
        server: ufo
        container: backrest
    - Cockpit:
        icon: cockpit
        href: http://ufo:9090
        description: OS management (host package)
    - Tailscale:
        icon: tailscale
        href: https://login.tailscale.com/admin/machines
        description: Tailnet admin console

