# LocalAI — OpenAI-compatible LLM API on the RTX 5090.
# Official CUDA 13 image: backends ship with it / download at runtime.
# There is NO hand-built backend on this system (that was the umbrelOS era).
# The entrypoint gate refuses to start without a visible GPU — LocalAI must
# never silently serve on CPU (the Nov 2026 failure mode).
services:
  server:
    image: localai/localai:v4.12.1-gpu-nvidia-cuda-13
    container_name: localai
    restart: unless-stopped
    ports:
      - "8080:8080"
    entrypoint:
      - /bin/sh
      - -c
      - |
        if ! nvidia-smi >/dev/null 2>&1; then
          echo "FATAL: no NVIDIA GPU visible in container - refusing to start (CPU fallback is disabled by design)"; exit 1
        fi
        exec /entrypoint.sh "$@"
      - --
    command: ["--address=:8080", "--models-path=/models", "--localai-config-dir=/configuration"]
    environment:
      TZ: America/New_York
      LOCALAI_FORCE_META_BACKEND_CAPABILITY: "nvidia"
      THREADS: "16"
      CONTEXT_SIZE: "8192"
    volumes:
      - ./models:/models
      - ./configuration:/configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      - homepage.group=AI
      - homepage.name=LocalAI
      - homepage.icon=localai
      - homepage.href=http://ufo:8080
      - homepage.description=LLM API (OpenAI-compatible)
