# Medusa — the self-hosted store for the SEPARATE store project
# (not Voodoo Bazaar). Backend + admin only: the customer storefront
# is a later build (Medusa's Next.js starter) that talks to this
# stack's Store API. Chosen for: REST APIs an agent can drive
# (Admin API + Store API), a light footprint, and a cheap exit —
# MIT core, data in plain Postgres.
#
# First run: the server container migrates the database on start.
# Then create the admin user (see README.md) and sign in at
# http://ufo:9000/app. Public exposure is a separate, deliberate
# step (tunnel + CORS), exactly like the Twenty portal rules.
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ufo/medusa:2.22.6
    container_name: medusa-server
    restart: unless-stopped
    environment: &medusa-env
      DATABASE_URL: postgres://medusa:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/medusa
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET in .env}
      STORE_CORS: ${STORE_CORS:-http://localhost:8000}
      ADMIN_CORS: ${ADMIN_CORS:-http://ufo:9000}
      AUTH_CORS: ${AUTH_CORS:-http://ufo:9000}
      MEDUSA_WORKER_MODE: server
    ports:
      - "9000:9000"
    depends_on:
      - db
      - redis
    labels:
      - homepage.group=Business
      - homepage.name=Medusa
      - homepage.icon=medusa
      - homepage.href=http://ufo:9000/app
      - homepage.description=Self-hosted store — backend + admin

  worker:
    image: ufo/medusa:2.22.6
    container_name: medusa-worker
    restart: unless-stopped
    environment:
      <<: *medusa-env
      MEDUSA_WORKER_MODE: worker
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: medusa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: medusa
    volumes:
      - ./data/db:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: medusa-redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
