# monerod — the one shared Monero node for BTCPay, P2Pool and wallets,
# plus the official GUI wallet (browser desktop) riding in the same stack.
# Same node image the Umbrel app used. PRUNED by default (see .env).
# RPC login is deliberately ON here (on umbrelOS it never actually was).
services:
  monerod:
    image: ghcr.io/sethforprivacy/simple-monerod:v0.18.5.4
    container_name: monerod
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "18080:18080" # P2P (public by design)
      - "18081:18081" # RPC (login required) — LAN/tailnet only, do not forward
      - "18083:18083" # ZMQ pub — for P2Pool
      - "18089:18089" # restricted RPC — wallets
    volumes:
      - ./data:/home/monero/.bitmonero
    command:
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=18081
      - --rpc-login=${MONERO_RPC_USER}:${MONERO_RPC_PASS}
      - --rpc-restricted-bind-ip=0.0.0.0
      - --rpc-restricted-bind-port=18089
      - --zmq-pub=tcp://0.0.0.0:18083
      - --p2p-bind-ip=0.0.0.0
      - --p2p-bind-port=18080
      - --public-node
      - --confirm-external-bind
      # Pruned node (~105 GiB). For a full node (~265 GiB), remove this
      # flag and delete ./data before starting.
      - --prune-blockchain
      - --out-peers=12
      - --in-peers=12
      - --limit-rate-up=1048576
      - --limit-rate-down=1048576
      # Relay transactions through the tor sidecar (clearnet identity stays
      # off the tx path, same as the Umbrel setup). Remove if tor is removed.
      # tor zone + disable_noise is the working form: the tor container's
      # pinned IP (Tor 0.4.9/monero 0.18 reject the other combinations at
      # p2p init — verified live 2026-11-09).
      - --tx-proxy=tor,10.99.99.3:9050,disable_noise
    networks:
      default:
        # Static IP: Tor's HiddenServicePort target must be an IP, not a
        # hostname (Tor 0.4.9 rejects hostname targets at config time).
        ipv4_address: 10.99.99.2
      # Shared network: BTCPay, Bitcart and Haveno reach the daemon as
      # http://monerod:18081 (with the RPC login from their own .env files).
      ufo-net:
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Monero Node
      - homepage.icon=monero
      - homepage.description=monerod (RPC on 18081)

  # Monero GUI wallet — official release in a Webtop browser desktop
  # (built from ./wallet, see its Dockerfile). TAILSCALE-ONLY, same class
  # as Twenty: it holds wallet keys. Never publish it beyond the LAN/
  # tailnet, never route it through the Cloudflare tunnel.
  # It talks to THIS stack's node: in the GUI, Settings → Node → Remote
  # node = monerod:18081 with the RPC login from .env (first-run steps in
  # this stack's README.md). The web UI itself is basic-auth protected
  # (WALLET_GUI_* in .env) — set a real password, it guards keys.
  wallet-gui:
    build:
      context: ./wallet
    image: ufo/monero-gui-wallet:0.18.5.4
    container_name: monero-gui-wallet
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
      CUSTOM_USER: ${WALLET_GUI_USER:-justin}
      PASSWORD: ${WALLET_GUI_PASSWORD:-}
      TITLE: Monero Wallet
    ports:
      - "3006:3000"
    volumes:
      # Webtop home dir: wallet files land in ./data/wallet/Monero/wallets.
      # data/ is gitignored — keys never enter the repo.
      - ./data/wallet:/config
    shm_size: "2gb"
    security_opt:
      - seccomp:unconfined
    depends_on:
      - monerod
    labels:
      - homepage.group=Payments
      - homepage.name=Monero GUI Wallet
      - homepage.icon=monero
      - homepage.href=http://ufo:3006
      - homepage.description=Official GUI wallet (tailnet only)

  # Tor sidecar — carries the RPC hidden service. If the pre-wipe key folders
  # were saved (see README Stage 0), drop them into ./tor-data/ before first
  # start and the old .onion address survives. tor-data/ is gitignored:
  # those keys are private keys, never commit them.
  tor:
    # The Umbrel tor image: its contract (torrc at /etc/tor/torrc, data at
    # /data, uid 1000) is verified from the umbrel-apps source. If the pull
    # ever fails, osminogin/tor-simple:0.4.9.16 is the maintained fallback
    # (adjust the torrc/data paths to its docs).
    image: ghcr.io/getumbrel/tor:0.4.9.11
    container_name: monerod-tor
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ./torrc:/etc/tor/torrc:ro
      - ./tor-data:/data
    networks:
      default:
        # Pinned: monerod's --tx-proxy points at this IP.
        ipv4_address: 10.99.99.3
    depends_on:
      - monerod

networks:
  default:
    ipam:
      config:
        - subnet: 10.99.99.0/24
  ufo-net:
    external: true
