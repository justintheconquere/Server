# Ollama — LLM runtime on the RTX 5090.
# Host prerequisites (README Stage 2): NVIDIA driver 580-open + container
# toolkit, Gate 2 passed. If models load on CPU, the driver is the problem.
services:
  ollama:
    image: ollama/ollama:0.40.15
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./data:/root/.ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      - homepage.group=AI
      - homepage.name=Ollama
      - homepage.icon=ollama
      - homepage.href=http://ufo:11434
      - homepage.description=LLM runtime (API)
