# Arcane — Docker management UI. Manages the host Docker directly
# (no Docker-in-Docker, unlike the old Umbrel packaging).
# Docs: https://getarcane.app/docs/get-started/installation
services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: arcane
    restart: unless-stopped
    ports:
      - "3552:3552"
    environment:
      # 32-byte key, generated on the box into .env (openssl rand -hex 32).
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Arcane manages the Compose projects in this repo's stacks/ folder.
      # The host path is mounted at the SAME path inside the container so
      # bind mounts inside those stacks resolve correctly.
      - PROJECTS_DIRECTORY=${STACKS_DIR}
      # Run as the stacks folder's owner so Arcane can read the project
      # files — its default identity (65532) cannot read a 750 home tree.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
      - ${STACKS_DIR}:${STACKS_DIR}

volumes:
  arcane-data:
