# Poznote — notes app + its MCP server, from the official upstream compose
# (github.com/timothepoznanski/poznote, checked 2026-11-09). Both images
# track the major tag :6, per upstream's own file.
#
# Muse reads/writes plans here. Two deliberate deviations from upstream:
# - The MCP port is published on all interfaces (upstream binds loopback
#   only) because Muse connects over the tailnet, not from the box itself.
#   It stays token-authenticated; never port-forward or tunnel it publicly.
# - Web UI on 8040, MCP on 8045.
# NOTE: this is the current public Poznote (v6.x) — the umbrelOS install it
# replaces ran an older build (MCP on :8340). Fresh instance: a NEW MCP
# auth token is set in .env at deploy, and Muse's Poznote connector gets
# pointed at http://<tailnet-ip>:8045/mcp afterwards.
services:
  webserver:
    image: ghcr.io/timothepoznanski/poznote:6
    container_name: poznote
    restart: unless-stopped
    env_file: .env
    environment:
      SQLITE_DATABASE: /var/www/html/data/database/poznote.db
      POZNOTE_PHP_FPM_MAX_CHILDREN: ${POZNOTE_PHP_FPM_MAX_CHILDREN:-}
      POZNOTE_PHP_MEMORY_LIMIT: ${POZNOTE_PHP_MEMORY_LIMIT:-}
    ports:
      - "${HTTP_WEB_PORT:-8040}:80"
    volumes:
      - ./data:/var/www/html/data
    healthcheck:
      test: ["CMD-SHELL", "port=$$(grep -o 'listen [0-9][0-9]*;' /etc/nginx/http.d/default.conf | head -n 1 | tr -dc 0-9); wget --quiet --tries=1 --timeout=5 -O /dev/null http://127.0.0.1:$${port:-80}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mcp-server:
    image: ghcr.io/timothepoznanski/poznote-mcp:6
    container_name: poznote-mcp
    restart: unless-stopped
    environment:
      POZNOTE_API_URL: http://webserver:80/api/v1
      POZNOTE_DEBUG: ${POZNOTE_DEBUG:-false}
      POZNOTE_USER_ID: ${POZNOTE_USER_ID:-1}
      # The Bearer token Muse presents. Set a strong one in .env
      # (openssl rand -hex 32); it is a credential — never commit it.
      POZNOTE_MCP_AUTH_TOKEN: ${POZNOTE_MCP_AUTH_TOKEN:-}
      POZNOTE_MCP_SCOPE: ${POZNOTE_MCP_SCOPE:-}
    ports:
      - "${POZNOTE_MCP_PORT:-8045}:8045"
    volumes:
      - ./data:/var/www/html/data:ro
    depends_on:
      - webserver
